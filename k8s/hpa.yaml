apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edgebalancer-server
  namespace: edgebalancer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edgebalancer-server
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 25
