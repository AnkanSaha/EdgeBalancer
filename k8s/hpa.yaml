apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edgebalancer-server
  namespace: edgebalancer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edgebalancer-server
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # of the 200m request = 140m sustained
